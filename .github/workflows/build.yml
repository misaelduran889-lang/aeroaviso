name: Compilar AeroAviso

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: App de Android (.apk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Revisar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar la web de la app
        run: |
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          sed -i "s#__APK_URL__#https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AeroAviso.apk#" www/index.html
          npx cap sync android

      - name: Usar siempre la misma firma (para poder actualizar la app)
        run: |
          mkdir -p ~/.android
          cp resources/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../AeroAviso.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AeroAviso-apk
          path: AeroAviso.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: AeroAviso 1.${{ github.run_number }}
          body: "Descarga AeroAviso.apk en tu teléfono Android e instálala."
          files: AeroAviso.apk
          make_latest: true

  web:
    name: Versión web (laptop)
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Enlace de descarga del APK
        run: sed -i "s#__APK_URL__#https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AeroAviso.apk#" www/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
